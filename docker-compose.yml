# Docker for local development.
#
#   docker compose up -d db              -> only PostgreSQL (lightest, recommended)
#   docker compose --profile tools up -d -> PostgreSQL + Adminer (a web page to browse the tables)
#   docker compose --profile full up -d  -> PostgreSQL + the API inside Docker too
#
# The tables and starter data are created automatically the first time the
# database starts (from backend/db/init.sql).

services:
  db:
    image: postgres:16-alpine
    container_name: habeeb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: habeeb
      POSTGRES_PASSWORD: habeeb_dev_pw
      POSTGRES_DB: habeeb
    ports:
      - "5432:5432"
    volumes:
      - habeeb_pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habeeb -d habeeb"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    profiles: ["tools"]
    ports:
      - "8080:8080"
    depends_on:
      - db

  api:
    build: ./backend
    profiles: ["full"]
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://habeeb:habeeb_dev_pw@db:5432/habeeb
      CLIENT_URL: http://localhost:5173
      ADMIN_KEY: change-me
    depends_on:
      db:
        condition: service_healthy

volumes:
  habeeb_pgdata:
